<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Laptop Finder - Favorites</title>
  <link rel="stylesheet" href="dist/output.css" />
  <script>
    try {
      var savedTheme = JSON.parse(localStorage.getItem("laptopFinder.theme"));
      document.documentElement.classList.add(
        savedTheme === "performance" ? "theme-performance" : "theme-battery"
      );
    } catch (error) {
      document.documentElement.classList.add("theme-battery");
    }
  </script>
</head>
<body class="min-h-screen">
  <div id="site-header"></div>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <span class="badge"><span class="h-1.5 w-1.5 rounded-full bg-app-accent"></span>Saved locally</span>
        <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-4xl">My favorites</h1>
        <p class="mt-2 max-w-2xl text-sm text-app-muted">Saved in your browser, shared with every page and still here after a reload.</p>
      </div>
      <button type="button" id="clear-favorites" class="btn-ghost">Clear all favorites</button>
    </div>

    <div id="favorites-summary" class="mt-7 grid grid-cols-1 gap-4 sm:grid-cols-3"></div>

    <div class="mt-8 flex items-center gap-2">
      <h2 class="text-lg font-black">Saved laptops</h2>
      <span class="h-px flex-1 bg-app-border"></span>
    </div>
    <div id="favorites-list" class="mt-5 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

    <div class="panel mt-9 flex flex-wrap items-center justify-between gap-4 bg-linear-to-r from-app-accent-soft to-app-surface">
      <div class="flex items-center gap-3">
        <span class="icon-chip h-10 w-10"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
        <div>
          <p class="text-sm font-black">Ready to decide?</p>
          <p class="text-xs text-app-muted">Compare your favorites side by side to find the best value.</p>
        </div>
      </div>
      <a href="compare.html" class="btn-action">Go to comparison</a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="src/js/favorites.js"></script>
</body>
</html>
