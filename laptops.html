<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Laptop Finder - Catalogue</title>
  <link rel="stylesheet" href="dist/output.css" />
  <script>
    try {
      var savedTheme = JSON.parse(localStorage.getItem("laptopFinder.theme"));
      document.documentElement.classList.add(
        savedTheme === "performance" ? "theme-performance" : "theme-battery"
      );
    } catch (error) {
      document.documentElement.classList.add("theme-battery");
    }
  </script>
</head>
<body class="min-h-screen">
  <div id="site-header"></div>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <span class="badge"><span class="h-1.5 w-1.5 rounded-full bg-app-accent"></span>Explore</span>
        <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-4xl">Laptop catalogue</h1>
        <p class="mt-2 max-w-2xl text-sm text-app-muted">Search, filter and sort the full list. Every control works together and updates the results as you type.</p>
      </div>
      <p id="result-count" class="rounded-xl border border-app-border bg-app-surface px-4 py-2.5 text-sm font-black text-app-accent shadow-sm" role="status">Loading laptops...</p>
    </div>

    <section class="panel mt-7" aria-label="Search and filter laptops">
      <div class="mb-5 flex items-center gap-2 border-b border-app-border pb-4">
        <span class="icon-chip h-8 w-8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg></span>
        <h2 class="text-sm font-black uppercase tracking-wide">Search &amp; filters</h2>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <div>
          <label for="search" class="section-label">Search name or brand</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-app-muted"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>
            <input type="search" id="search" placeholder="e.g. Asus or XPS" class="field pl-10" />
          </div>
        </div>
        <div>
          <label for="category" class="section-label">Category</label>
          <select id="category" class="field">
            <option value="all">All categories</option>
            <option value="ultrabook">Ultrabook</option>
            <option value="gaming">Gaming</option>
            <option value="2-in-1">2-in-1</option>
            <option value="creator">Creator</option>
            <option value="budget">Budget</option>
          </select>
        </div>
        <div>
          <label for="max-price" class="section-label">Maximum price ($)</label>
          <input type="number" id="max-price" min="0" step="100" placeholder="Any price" class="field" />
        </div>
        <div>
          <label for="min-ram" class="section-label">Minimum RAM</label>
          <select id="min-ram" class="field">
            <option value="0">Any RAM</option>
            <option value="8">8 GB or more</option>
            <option value="16">16 GB or more</option>
            <option value="32">32 GB or more</option>
            <option value="64">64 GB or more</option>
          </select>
        </div>
        <div>
          <label for="min-battery" class="section-label">Minimum battery life</label>
          <select id="min-battery" class="field">
            <option value="0">Any battery</option>
            <option value="8">8 hours or more</option>
            <option value="10">10 hours or more</option>
            <option value="12">12 hours or more</option>
            <option value="16">16 hours or more</option>
          </select>
        </div>
        <div>
          <label for="sort" class="section-label">Sort by</label>
          <div class="flex gap-2">
            <select id="sort" class="field">
              <option value="price">Price</option>
              <option value="batteryHours">Battery life</option>
              <option value="weightKg">Weight</option>
            </select>
            <button type="button" id="sort-dir" class="btn-ghost whitespace-nowrap px-3">
              <span id="sort-dir-label">Low to high</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-app-border pt-4">
        <p class="text-xs font-semibold text-app-muted">Tip: combine search, category, price and specs to narrow the list.</p>
        <button type="button" id="reset-filters" class="btn-ghost">Reset filters</button>
      </div>
    </section>

    <div id="laptop-grid" class="mt-7 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="src/js/laptops.js"></script>
</body>
</html>
